name: MARVeLus

on:
   - push
    
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver:
          - sundials
          - nosundials
        plot:
          - gtk
          - nogtk
        ocaml-version:
          - 4.13.1
          - 4.08.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
        
      - name: Install OCaml dependencies
        run: opam install -y graphics ocamlfind menhir
      
      - name: Install Z3
        run: opam install z3
      
      - name: Build MARVeLus
        run: |
          chmod 775 ./github-actions-push.sh
          ./github-actions-push.sh

